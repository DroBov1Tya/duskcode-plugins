# A plugin's packages: a tag <name>-v<version> builds plugins/<name> for each system it
# supports and uploads the archives to that tag's release. The store's list is signed by
# a maintainer on their own machine afterwards (scripts/publish.py); CI holds no key.
name: release

on:
  push:
    tags: ["*-v*"]

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Packages of $GITHUB_REF_NAME for the duskcode store."

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plugin
        id: plugin
        run: |
          name="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          manifest="plugins/$name/plugin.yml"
          test -f "$manifest"
          grep -qx "version: $version" "$manifest"
          case "${{ matrix.target }}" in *apple*) os=macos ;; *) os=linux ;; esac
          # A plugin made for other systems only is not built here.
          if grep -q "^platforms:" "$manifest" && ! grep -Eq "^platforms:.*[^a-z]$os([^a-z]|$)" "$manifest"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Toolchain
        if: steps.plugin.outputs.build == 'true'
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.plugin.outputs.build == 'true'
        with:
          key: ${{ matrix.target }}
      - name: Build
        if: steps.plugin.outputs.build == 'true'
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p ${{ steps.plugin.outputs.name }}
          sh scripts/package.sh ${{ steps.plugin.outputs.name }} ${{ matrix.target }}
      - name: Upload
        if: steps.plugin.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY"
