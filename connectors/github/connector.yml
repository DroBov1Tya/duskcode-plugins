name: github
version: 1.0.0
description: Repositories, issues, pull requests and Actions on GitHub. GitHub's own server; it takes a personal access token you put in its settings. Not affiliated with or endorsed by GitHub.
server:
  url: https://api.githubcopilot.com/mcp/
  auth: key
  secrets:
  - Authorization
  docs: https://github.com/github/github-mcp-server
  run_by: vendor
  reaches: the repositories, issues and pull requests your token allows
