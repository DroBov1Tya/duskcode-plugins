[workspace]
resolver = "3"
members = ["crates/phone-kit", "plugins/telegram", "plugins/ios-simulator", "plugins/vphone"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }
parking_lot = "0.12"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io"] }
phone-kit = { path = "crates/phone-kit" }
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls", "throttle"] }

[profile.release]
strip = true
